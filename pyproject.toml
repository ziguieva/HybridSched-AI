[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridsched-ai"
version = "0.1.0"
description = "Learning-Based Scheduling for Hybrid Cloud and HPC Clusters"
requires-python = ">=3.12,<3.13"
dependencies = ["simpy>=4.1,<5"]

[project.optional-dependencies]
research = [
    "numpy>=2,<3",
    "pandas>=2,<4",
    "ortools>=9.10,<10"
]
ml = [
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4"
]

dev = [
    "pytest>=8,<10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
